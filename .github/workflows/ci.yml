name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            deps: latest
          - python-version: "3.13"
            deps: latest
          # Oldest supported scikit-learn: it predates __sklearn_tags__, so this
          # row proves the blocks work without the tags API. scikit-learn 1.3
          # was built against NumPy 1.x.
          - python-version: "3.10"
            deps: oldest
            extra: '"scikit-learn==1.3.*" "numpy<2"'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Install oldest supported versions
        if: matrix.extra
        run: uv pip install ${{ matrix.extra }}
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest

  omniship:
    name: OmniShip files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # workflow.py is the source of truth for omniship.yaml, omniship.lock and
      # the check / build / ship workflows; this fails if they were not regenerated.
      - name: Check generated files
        run: uvx --from omniship==0.6.0 omniship generate --check
