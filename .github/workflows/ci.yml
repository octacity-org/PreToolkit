name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            deps: latest
          - python-version: "3.13"
            deps: latest
          # Oldest supported scikit-learn: it predates __sklearn_tags__, so this
          # row proves the blocks work without the tags API. scikit-learn 1.3
          # was built against NumPy 1.x.
          - python-version: "3.10"
            deps: oldest
            extra: '"scikit-learn==1.3.*" "numpy<2"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" ${{ matrix.extra }}
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
