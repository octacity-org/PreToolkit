[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pretoolkit"
version = "0.1.0"
description = "Composable, reproducible data preprocessing for machine learning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Octacity .LUCID team" }]
keywords = [
    "preprocessing",
    "machine-learning",
    "pandas",
    "scikit-learn",
    "data-leakage",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/octacity-org/PreToolkit"
Repository = "https://github.com/octacity-org/PreToolkit"
Issues = "https://github.com/octacity-org/PreToolkit/issues"
Changelog = "https://github.com/octacity-org/PreToolkit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["ipykernel", "nbconvert", "pytest", "ruff", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
